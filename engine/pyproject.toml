[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marga-engine"
version = "1.0.0"
description = "MARGA core engine: deterministic terrain-aware A* routing and EVA budget logic for Mars surface excursions"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
geotiff = ["tifffile>=2023.1"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
test = ["pytest>=7", "httpx>=0.27", "tifffile>=2023.1", "fastapi>=0.110"]

[project.scripts]
marga-engine = "marga_engine.cli:main"

[tool.setuptools.packages.find]
include = ["marga_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
